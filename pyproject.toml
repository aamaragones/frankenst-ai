[build-system]
requires = ["setuptools>=78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "frankstate"
version = "0.2.2"
description = "Frank brings order and helps you build complex LLM workflows using scalable, testable, and reusable components."
license = "MIT"
readme = { file = "README-pypi.md", content-type = "text/markdown" }
requires-python = ">=3.12.3"
dependencies = [
    "langchain-core>=1.6,<1.7",
    "langgraph>=1.2,<1.4",
    "pydantic>=2.13,<2.14",
]
authors = [
    { name = "aamaragones", email = "aangel.maragones@outlook.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent"
]
keywords = ["LLM", "azure", "langgraph", "langchain", "azure-foundry", "unstructured", "multimodal"]

[project.optional-dependencies]
examples = [
    "langchain",
    "PyYAML",
    "pydantic-settings",
    "requests",
    "azure-functions",
    "azure-keyvault-secrets",
    "azure-identity",
    "azure-search-documents",
    "azure-storage-blob",
    "langchain-azure-ai[opentelemetry]",
    "langchain-ollama",
    "databricks-langchain",
    "langchain-chroma",
    "langchain-classic",
    "langchain-mcp-adapters",
    "fastmcp",
    "Pillow",
    "tenacity",
    "unstructured[pdf]",
    "ipykernel",
    "ipywidgets",
    "matplotlib",
]

[project.urls]
homepage = "https://github.com/aamaragones/frankenst-ai"
changelog = "https://github.com/aamaragones/frankenst-ai/blob/main/CHANGELOG.md"
issues = "https://github.com/aamaragones/frankenst-ai/issues"
repository = "https://github.com/aamaragones/frankenst-ai"

[dependency-groups]
lint = [
    "mypy==2.1.0",
    "ruff==0.15.13",
    "pre-commit==4.4.0",
    "types-PyYAML==6.0.12.20260518",
]
test = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "build==1.4.2",
    "twine==6.2.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["frankstate", "frankstate.*"]
namespaces = false
# Only `frankstate` ships; config, utils, core_ai_examples and services stay in the repo.

[tool.setuptools.package-data]
frankstate = ["py.typed"]

[tool.ruff]
line-length = 88
indent-width = 4
extend-include = ["*.ipynb"]
target-version = "py312"

[tool.ruff.lint]
# RUF100 catches a `# noqa` that no longer suppresses anything.
select = ["E", "F", "I", "UP", "B", "N", "D", "RUF100"]
ignore = ["E501", "D104", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# D stays off where the 15% comment budget leaves no room for one-line docstrings.
"tests/**" = ["D"]
"research/**" = ["D"]
"src/core_ai_examples/**" = ["D"]
"src/services/functions/**" = ["D"]
"src/services/mcp/**" = ["D"]
# Module and class docstrings stay required here; one per method would only restate the name.
"src/config/**" = ["D102", "D103", "D105"]
"src/utils/**" = ["D102", "D103", "D105"]
"src/services/llm/**" = ["D102", "D103", "D105"]
".github/scripts/**" = ["D102", "D103", "D105"]
"main.py" = ["D102", "D103", "D105"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests/support", ".github/scripts", "main.py"]
strict = true
explicit_package_bases = true
mypy_path = ["src"]
warn_no_return = false
warn_unused_ignores = true
warn_redundant_casts = true
allow_redefinition = true

[[tool.mypy.overrides]]
module = ["langchain_azure_ai.*", "databricks_langchain.*", "IPython", "IPython.*"]
ignore_missing_imports = true

# function_app.py is assembled inside the Functions container, where the blueprints
# are top-level modules; azure.functions ships no types for Blueprint.
[[tool.mypy.overrides]]
module = ["get_evolution_mcptool.*", "indexer_pokeseriex_eventgrid.*", "retriever_pokeseriex_mcptool.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["services.functions.*"]
disable_error_code = ["no-untyped-call"]

[tool.pytest.ini_options]
testpaths = ["tests/unit_test", "tests/integration_test"]
pythonpath = ["src", ".", ".github/scripts"]
python_files = ["test_*.py"]
addopts = "-ra"
markers = [
    "unit: fast Frankenst-AI contract tests",
    "integration: compiled workflows and packaging flows (wheel build)",
]

[tool.coverage.run]
source = ["src", ".github/scripts", "main.py"]
branch = true

[tool.coverage.report]
show_missing = true
# Whole-tree floor, measured at 47% before the refactor; ratchet it up, never down.
fail_under = 45
exclude_lines = ["pragma: no cover", 'if __name__ == "__main__":']
