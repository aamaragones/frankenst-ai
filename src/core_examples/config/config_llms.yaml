# Global runtime configuration shared by notebooks, scripts and services.
#
# `launch.<kind>` (model / embeddings / turbo_model) selects the provider used
# by `LLMServices.build_runtime()` and `LLMServices.launch()`. The provider
# sections define the constructor kwargs passed to each backend client after
# resolving any `secret:` through `get_secret()` (environment first, then
# Azure Key Vault).
#
# Every runtime is optional: it is built only when `launch.<kind>` AND
# `<provider>.<kind>` are declared. Comment out either key to skip it — the
# provider package is then never imported.

ollama:
  model:
    model: gemma4:e4b-it-qat # qwen3.5:9b-q4_K_M
    temperature: 0
  embeddings:
    model: embeddinggemma

azure_ai:
  model:
    project_endpoint:
      secret: AZURE_FOUNDRY_PROJECT_ENDPOINT
    # credential: # Not needed if DefaultAzureCredential can find the right credentials in the environment or managed identity.
    #   secret: AZURE_INFERENCE_CREDENTIAL
    model:
      secret: AZURE_INFERENCE_MODEL_NAME
    temperature: 0
  embeddings:
    endpoint:
      secret: AZURE_EMBEDDINGS_ENDPOINT
    # credential: # Not needed if DefaultAzureCredential can find the right credentials in the environment or managed identity.
    #   secret: AZURE_EMBEDDINGS_CREDENTIAL
    model:
      secret: AZURE_EMBEDDINGS_MODEL_NAME

databricks:
  model:
    # Serving endpoint / AI Gateway model name, e.g. "system.ai.gpt-5-6-sol".
    endpoint:
      secret: DATABRICKS_LLM_ENDPOINT
    # The AI Gateway authenticates the ambient identity — no tokens anywhere.
    use_ai_gateway: true
  # embeddings:
  #   endpoint:
  #     secret: DATABRICKS_EMBEDDINGS_ENDPOINT

launch:
  model: ollama # azure_ai | databricks
  embeddings: ollama # azure_ai | databricks
  # turbo_model: ollama
