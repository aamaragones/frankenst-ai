# Node registry read by graph layouts through `utils.config_loader.load_node_registry`.
# - `id`:           registry key used in layouts (CONFIG_NODES["OAKLANG_NODE"]).
# - `name`:         runtime name passed to LangGraph node constructors.
# - `type`:         documentation of the node kind the layout builds (enhancer | tools | commander).
# - `metadata`:     forwarded verbatim to StateGraph.add_node(metadata=...). `tools` and
#                   `sensitive_tools` list tool names; a name no tool carries fails build_runtime.
# - `destinations`: literal destination node names read by StateCommander subclasses.

nodes:

  ##################### OAKLANG NODES ####################

  - id: OAKLANG_NODE
    name: OakLangAgent
    type: enhancer
    metadata:
      description: Main agent node. It binds tools and produces the next assistant message.

  - id: OAKTOOLS_NODE
    name: OakTools
    type: tools
    metadata:
      description: Tool node executed when the OakLangAgent node emits tool calls.
      tools: [get_evolution, random_movements, dominate_pokemon]

  - id: SIMPLE_OAKTOOLS_NODE
    name: OakTools
    type: tools
    metadata:
      description: Tool node of the simple layout, which has no review step and so binds no sensitive tool.
      tools: [get_evolution, random_movements]

  - id: HUMAN_REVIEW_NODE
    name: HumanReview
    type: commander
    metadata:
      description: Command node that routes to tools or back to the enhancer after human review.
      sensitive_tools: [dominate_pokemon]
    destinations:
      enhancer: OakLangAgent
      tools: OakTools

  ##################### RAG NODES ########################

  - id: GENERATION_NODE
    name: GenerationNode
    type: enhancer
    metadata:
      description: Node that generates the final answer from the current question and retrieved context.

  - id: RETRIEVER_NODE
    name: RetrieverNode
    type: enhancer
    metadata:
      description: Node that retrieves context for the current question.

  - id: REWRITE_NODE
    name: RewriteNode
    type: enhancer
    metadata:
      description: Node that rewrites the question before another retrieval iteration.
