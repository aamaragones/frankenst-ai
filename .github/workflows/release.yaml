# Release and publish in one run: semantic-release pushes the tag with GITHUB_TOKEN,
# and GitHub starts no workflow for that push, so a tag-triggered publish would
# never fire. `dist/` exists only when a version was cut, which gates the upload.
name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run semantic-release without committing, tagging or publishing
        type: boolean
        default: false
      republish_tag:
        description: Rebuild an existing tag and upload it to PyPI (upload failed after the tag)
        type: string
        default: ""

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  quality:
    name: quality
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yaml
    secrets: inherit

  release:
    name: release
    needs: quality
    if: github.event_name == 'push' || inputs.dry_run
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-suffix: release

      - name: Sync project with development dependencies
        run: uv sync --frozen --group dev

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install release tooling
        run: npm install --no-audit --no-fund

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: npx semantic-release $DRY_RUN

      - name: Detect a cut release
        id: dist
        run: |
          if ls dist/*.whl >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish distribution to PyPI
        if: steps.dist.outputs.released == 'true' && !inputs.dry_run
        uses: pypa/gh-action-pypi-publish@release/v1

  republish:
    name: republish
    needs: quality
    if: inputs.republish_tag != ''
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.republish_tag }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-suffix: republish

      - name: Sync project with development dependencies
        run: uv sync --frozen --group dev

      - name: Build wheel and sdist
        run: make build

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
