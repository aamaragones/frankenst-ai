# Every step is a Makefile target so CI and `make ci` cannot drift. Called by
# release.yaml on push to main, so each push runs the gates exactly once.
name: ci

on:
  pull_request:
    branches:
      - main
  workflow_call: {}
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frankstate:
    name: frankstate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-suffix: frankstate-${{ matrix.python-version }}

      - name: Sync project with development dependencies
        run: uv sync --frozen --group dev

      - name: Test the published slice with its coverage gate
        run: make cov-frankstate

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-suffix: quality

      - name: Sync project with examples and dev dependencies
        run: uv sync --frozen --extra examples --group dev

      - name: YAML extension check
        run: make yaml-check

      - name: Lint
        run: make lint

      - name: Format check
        run: make format-check

      - name: Type check
        run: make type

      - name: Comment ratio
        run: make comment-ratio

      - name: Tests with coverage
        run: make cov

      - name: Build distributions
        run: make build

      - name: Pre-commit hooks
        run: make pre-commit

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-suffix: security

      - name: Audit locked runtime dependencies
        run: make audit

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
